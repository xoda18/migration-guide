name: UI tests

on:
  # 02:17 UTC. Not on the hour: GitHub delays scheduled runs at peak times, and the
  # top of every hour is a peak. Note that GitHub disables the schedule by itself
  # after 60 days without activity in a public repository.
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ui-tests
  cancel-in-progress: false

jobs:
  starter-driver:
    name: Starter and Driver
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: temurin

      - uses: gradle/actions/setup-gradle@v4

      - name: Start a virtual screen
        run: |
          # The runner has no monitor. Xvfb is a real X server that draws into memory,
          # which is what the IDE connects to and what java.awt.Robot moves the pointer on.
          # fluxbox is a minimal window manager: without one, X never hands the IDE window
          # the keyboard focus, and every action resolved against the focused component fails.
          sudo apt-get update -qq
          sudo apt-get install -y -qq fluxbox ffmpeg
          Xvfb :99 -screen 0 1920x1080x24 &
          for _ in $(seq 1 40); do [ -e /tmp/.X11-unix/X99 ] && break; sleep 0.5; done
          DISPLAY=:99 fluxbox > /dev/null 2>&1 &
          echo "DISPLAY=:99" >> "$GITHUB_ENV"

      - name: Start recording the screen
        run: bash .github/scripts/record-screen.sh start

      - name: Run the scenarios
        run: ./gradlew :starter-driver:integrationTest

      - name: Stop recording the screen
        if: always()
        run: bash .github/scripts/record-screen.sh stop

      - name: Summarise
        if: always()
        run: python3 .github/scripts/summarise_tests.py >> "$GITHUB_STEP_SUMMARY"

      - name: Collect the recording
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: starter-driver-video
          path: screen.mp4
          retention-days: 7
          if-no-files-found: warn

      - name: Collect test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: starter-driver-results
          path: starter-driver/build/test-results/
          if-no-files-found: ignore

      - name: Collect IDE logs and screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: starter-driver-ide-output
          include-hidden-files: true
          path: |
            starter-driver/build/reports/
            out/ide-tests/tests/**/log/**
            starter-driver/out/ide-tests/tests/**/log/**
          if-no-files-found: ignore

  legacy-robot:
    name: Legacy robot
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: temurin

      - uses: gradle/actions/setup-gradle@v4

      - name: Start a virtual screen
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fluxbox ffmpeg
          Xvfb :99 -screen 0 1920x1080x24 &
          for _ in $(seq 1 40); do [ -e /tmp/.X11-unix/X99 ] && break; sleep 0.5; done
          DISPLAY=:99 fluxbox > /dev/null 2>&1 &
          echo "DISPLAY=:99" >> "$GITHUB_ENV"

      - name: Start the IDE with robot-server
        run: |
          # This is the first of the two terminals from the README. The IDE outlives the
          # test JVM, so it runs in the background and the next step waits for its port.
          nohup ./gradlew :legacy-robot:runIdeForUiTests > ide.log 2>&1 &
          echo $! > ide.pid
          timeout 600 bash -c \
            'until curl -s -o /dev/null --max-time 5 http://127.0.0.1:8082; do sleep 3; done'

      - name: Start recording the screen
        run: bash .github/scripts/record-screen.sh start

      - name: Run the scenarios
        run: ./gradlew :legacy-robot:test

      - name: Stop recording the screen
        if: always()
        run: bash .github/scripts/record-screen.sh stop

      - name: Stop the IDE
        if: always()
        run: kill "$(cat ide.pid)" 2> /dev/null || true

      - name: Summarise
        if: always()
        run: python3 .github/scripts/summarise_tests.py >> "$GITHUB_STEP_SUMMARY"

      - name: Collect the recording
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: legacy-robot-video
          path: screen.mp4
          retention-days: 7
          if-no-files-found: warn

      - name: Collect test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: legacy-robot-results
          path: legacy-robot/build/test-results/
          if-no-files-found: ignore

      - name: Collect IDE logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: legacy-robot-ide-output
          include-hidden-files: true
          path: |
            ide.log
            legacy-robot/build/reports/
            .intellijPlatform/sandbox/**/log/**
          if-no-files-found: ignore
