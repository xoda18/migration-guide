name: UI tests

on:
  # 02:17 UTC. Not on the hour: GitHub delays scheduled runs at peak times, and the
  # top of every hour is a peak. Note that GitHub disables the schedule by itself
  # after 60 days without activity in a public repository.
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ui-tests
  cancel-in-progress: false

jobs:
  starter-driver:
    name: Starter and Driver
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        run: |
          # One IDE distribution is 1.6 GB and Starter unpacks a copy of it per test,
          # so the toolchains that come with the runner image have to go first.
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/share/boost /opt/hostedtoolcache/CodeQL || true
          docker image prune -af || true
          df -h /

      - uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: temurin

      - uses: gradle/actions/setup-gradle@v4

      - name: Start a virtual screen
        run: |
          # The runner has no monitor. Xvfb is a real X server that draws into memory,
          # which is what the IDE connects to and what java.awt.Robot moves the pointer on.
          # fluxbox is a minimal window manager: without one, X never hands the IDE window
          # the keyboard focus, and every action resolved against the focused component fails.
          sudo apt-get update -qq
          sudo apt-get install -y -qq fluxbox
          Xvfb :99 -screen 0 1920x1080x24 &
          for _ in $(seq 1 40); do [ -e /tmp/.X11-unix/X99 ] && break; sleep 0.5; done
          DISPLAY=:99 fluxbox > /dev/null 2>&1 &
          echo "DISPLAY=:99" >> "$GITHUB_ENV"

      - name: Run the scenarios
        run: ./gradlew :starter-driver:integrationTest

      - name: Disk space after the run
        if: always()
        run: df -h /

      - name: Collect test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: starter-driver-reports
          path: |
            starter-driver/build/reports/
            starter-driver/build/test-results/
          if-no-files-found: ignore

      - name: Collect IDE logs and screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: starter-driver-ide-output
          path: |
            starter-driver/out/ide-tests/tests/**/log/**
            starter-driver/out/ide-tests/tests/**/*.png
          if-no-files-found: ignore

  legacy-robot:
    name: Legacy robot
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/share/boost /opt/hostedtoolcache/CodeQL || true
          docker image prune -af || true
          df -h /

      - uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: temurin

      - uses: gradle/actions/setup-gradle@v4

      - name: Start a virtual screen
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fluxbox
          Xvfb :99 -screen 0 1920x1080x24 &
          for _ in $(seq 1 40); do [ -e /tmp/.X11-unix/X99 ] && break; sleep 0.5; done
          DISPLAY=:99 fluxbox > /dev/null 2>&1 &
          echo "DISPLAY=:99" >> "$GITHUB_ENV"

      - name: Start the IDE with robot-server
        run: |
          # This is the first of the two terminals from the README. The IDE outlives the
          # test JVM, so it runs in the background and the next step waits for its port.
          nohup ./gradlew :legacy-robot:runIdeForUiTests > ide.log 2>&1 &
          echo $! > ide.pid
          timeout 600 bash -c \
            'until curl -s -o /dev/null --max-time 5 http://127.0.0.1:8082; do sleep 3; done'

      - name: Run the scenarios
        run: ./gradlew :legacy-robot:test

      - name: Stop the IDE
        if: always()
        run: |
          kill "$(cat ide.pid)" 2> /dev/null || true
          df -h /

      - name: Collect test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: legacy-robot-reports
          path: |
            legacy-robot/build/reports/
            legacy-robot/build/test-results/
          if-no-files-found: ignore

      - name: Collect the IDE output
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: legacy-robot-ide-output
          path: |
            ide.log
            .intellijPlatform/sandbox/**/log/**
          if-no-files-found: ignore
